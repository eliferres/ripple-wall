<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="20">
  <title id="t">ripple-wall demo terminal</title>
  <desc id="d">A terminal session: opening a batch on the shared system prompt, close refusing with two unaccounted strings, then waiving the one that genuinely does not apply and closing clean.</desc>
  <style>
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="460" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">taste, enforced</text>
  <text x="24" y="80"><tspan class="p">$</tspan><tspan class="cmd" dx="8">./ripple-wall.sh open demo/prompts/system-prompt.md</tspan></text>
  <text x="24" y="112" class="dim">RIPPLE BATCH OPEN — demo/prompts/system-prompt.md touched (…</text>
  <text x="24" y="144" class="dim">  Next: ./ripple-wall.sh close</text>
  <text x="24" y="176"><tspan class="p">$</tspan><tspan class="cmd" dx="8">./ripple-wall.sh close</tspan></text>
  <text x="24" y="208" class="bad">RIPPLE WALL: batch CANNOT close — 2 mapped string(s) unacco…</text>
  <text x="24" y="240" class="bad">  MISSING system-prompt/readme-rules — demo/README.md</text>
  <text x="24" y="272" class="bad">  MISSING system-prompt/reviewer-config — demo/agents/revie…</text>
  <text x="24" y="304"><tspan class="p">$</tspan><tspan class="cmd" dx="8">./ripple-wall.sh waive system-prompt/reviewer-config \</tspan></text>
  <text x="24" y="336" class="cmd">    &quot;unchanged because the reviewer only ever sees diffs, \</text>
  <text x="24" y="368" class="cmd">    never file ownership&quot; &amp;&amp; ./ripple-wall.sh close</text>
  <text x="24" y="400" class="dim">ripple: answer recorded for system-prompt/reviewer-config</text>
  <text x="24" y="432" class="good">RIPPLE WALL: batch CLOSED clean — 3 moved, 1 answered, acro…</text>
</svg>